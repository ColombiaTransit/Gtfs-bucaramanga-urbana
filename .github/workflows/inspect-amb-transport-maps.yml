name: Inspect AMB transport and station maps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install RAR and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          pip install requests pymupdf
      - name: Extract and inspect two PDF maps
        run: python scripts/inspect_amb_transport_maps.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amb-transport-map-analysis
          path: data/reports/amb_cartography_maps/
          retention-days: 90
          if-no-files-found: warn
