name: Scrape AMB official TPC route catalogue
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4==4.14.3
      - name: Archive AMB route catalogue and map references
        run: python scripts/scrape_amb_tpc_routes.py
      - name: Upload source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: amb-tpc-routes
          path: data/sources/amb_tpc_routes/
          if-no-files-found: warn
      - name: Commit source snapshot (not GTFS)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources/amb_tpc_routes/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh AMB official TPC route catalogue"
            git push
          fi
